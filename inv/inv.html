<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator — Md Abdul Kayum</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c1f;
    --border: #2a2a2e;
    --border2: #333338;
    --accent: #c8f135;
    --accent2: #a8d020;
    --text: #f0f0f0;
    --text2: #a0a0a8;
    --text3: #606068;
    --radius: 12px;
    --radius-sm: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .app-logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .app-logo span { color: var(--text2); font-weight: 400; }
  .header-actions { display: flex; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border: none;
    transition: all 0.18s;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .btn-primary {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ── LAYOUT ── */
  .workspace {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: calc(100vh - 62px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    overflow-y: auto;
    max-height: calc(100vh - 62px);
    position: sticky;
    top: 62px;
  }
  .sidebar-section { margin-bottom: 24px; }
  .sidebar-title {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    margin-bottom: 5px;
    letter-spacing: 0.04em;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    background: #1a1a1d;
  }
  .field select { cursor: pointer; }
  .field select option { background: var(--bg); }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .color-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; }

  /* ── PREVIEW ── */
  .preview-area {
    background: #1a1a1d;
    padding: 32px;
    overflow-y: auto;
  }
  .preview-wrap {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  /* ── INVOICE STYLES ── */
  .inv {
    font-family: 'Syne', sans-serif;
    color: #1a1a1a;
    background: #fff;
  }

  .inv-header {
    padding: 40px 44px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: var(--inv-accent, #c8f135);
    position: relative;
    overflow: hidden;
  }
  .inv-header::after {
    content: 'INVOICE';
    position: absolute;
    right: -10px;
    bottom: -30px;
    font-size: 120px;
    font-weight: 800;
    letter-spacing: -4px;
    color: rgba(0,0,0,0.06);
    line-height: 1;
    pointer-events: none;
  }
  .inv-brand-name {
    font-size: 24px;
    font-weight: 800;
    color: #0d0d0f;
    line-height: 1.1;
  }
  .inv-brand-title {
    font-size: 12px;
    color: rgba(0,0,0,0.55);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
  }
  .inv-brand-contact {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(0,0,0,0.6);
    line-height: 1.8;
    font-family: 'DM Mono', monospace;
  }
  .inv-meta { text-align: right; }
  .inv-label {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .inv-num {
    font-size: 22px;
    font-weight: 700;
    color: #0d0d0f;
    margin-top: 2px;
  }
  .inv-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    background: rgba(0,0,0,0.12);
    border-radius: 20px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: rgba(0,0,0,0.65);
    letter-spacing: 0.06em;
  }

  .inv-body { padding: 36px 44px; }

  .inv-info-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid #ebebeb;
  }
  .inv-info-block .lbl {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .inv-info-block .val {
    font-size: 13px;
    color: #1a1a1a;
    line-height: 1.6;
    font-weight: 500;
  }
  .inv-info-block .val.muted { color: #888; font-weight: 400; font-size: 12px; }

  .inv-table-wrap { margin-bottom: 28px; }
  .inv-table { width: 100%; border-collapse: collapse; }
  .inv-table thead tr {
    background: #f5f5f5;
    border-radius: 8px;
  }
  .inv-table th {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 10px 14px;
    font-weight: 500;
    text-align: left;
  }
  .inv-table th:last-child { text-align: right; }
  .inv-table td {
    padding: 14px 14px;
    font-size: 13px;
    color: #1a1a1a;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: top;
  }
  .inv-table td:last-child { text-align: right; font-family: 'DM Mono', monospace; font-size: 13px; }
  .inv-table .item-desc { font-weight: 600; font-size: 14px; }
  .inv-table .item-note { font-size: 11px; color: #999; margin-top: 2px; }
  .inv-table tbody tr:last-child td { border-bottom: none; }

  .inv-totals-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 28px;
  }
  .inv-totals {
    width: 280px;
    border: 1px solid #ebebeb;
    border-radius: 10px;
    overflow: hidden;
  }
  .inv-total-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    font-size: 13px;
    border-bottom: 1px solid #f0f0f0;
  }
  .inv-total-line:last-child { border-bottom: none; }
  .inv-total-line .tl-label { color: #888; font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .inv-total-line .tl-val { font-family: 'DM Mono', monospace; font-weight: 500; color: #1a1a1a; }
  .inv-total-line.grand {
    background: var(--inv-accent, #c8f135);
    padding: 14px 16px;
  }
  .inv-total-line.grand .tl-label { color: rgba(0,0,0,0.6); font-size: 12px; }
  .inv-total-line.grand .tl-val { font-size: 20px; font-weight: 800; color: #0d0d0f; }

  .inv-bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding-top: 24px;
    border-top: 1px solid #ebebeb;
  }
  .inv-bank-block .blbl {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .inv-bank-line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f5f5f5; }
  .inv-bank-line .bk { font-size: 11px; color: #aaa; font-family: 'DM Mono', monospace; }
  .inv-bank-line .bv { font-size: 11px; color: #1a1a1a; font-weight: 500; text-align: right; max-width: 160px; }

  .inv-notes-block .nlbl {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .inv-notes-text {
    font-size: 12px;
    color: #888;
    line-height: 1.7;
    font-family: 'DM Mono', monospace;
  }

  .inv-footer {
    margin-top: 28px;
    padding: 16px 44px;
    background: #f8f8f8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .inv-footer-left {
    font-size: 11px;
    color: #bbb;
    font-family: 'DM Mono', monospace;
  }
  .inv-footer-right {
    font-size: 11px;
    color: #ccc;
    font-family: 'DM Mono', monospace;
  }

  /* ── ITEMS EDITOR ── */
  .items-editor { margin-bottom: 16px; }
  .item-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .item-row-top { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: start; margin-bottom: 8px; }
  .item-row-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item-del {
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .item-del:hover { background: #3a1515; border-color: #7a3030; color: #f08080; }
  .item-amt-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 9px 12px;
    min-width: 90px;
    text-align: right;
  }
  .add-item-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .add-item-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(200,241,53,0.04); }

  .currency-row { display: flex; gap: 8px; }
  .currency-row .field { flex: 1; }

  /* ── SUMMARY PILLS ── */
  .summary-pills {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }
  .pill span { color: var(--accent); font-weight: 500; }

  /* ── PRINT ── */
  @media print {
    body { background: #fff !important; }
    .app-header, .workspace .sidebar, .preview-area > .summary-pills { display: none !important; }
    .workspace { display: block; }
    .preview-area { padding: 0; background: #fff; }
    .preview-wrap { box-shadow: none; border-radius: 0; max-width: 100%; }
    @page { margin: 0; size: A4; }
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">MAK<span>.dev</span> · Invoice Generator</div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="resetForm()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.15"/></svg>
      Reset
    </button>
    <button class="btn btn-primary" onclick="printInvoice()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save PDF
    </button>
  </div>
</header>

<div class="workspace">
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-title">Your Info</div>
      <div class="field"><label>Full Name</label><input id="f_name" value="Md Abdul Kayum" oninput="render()"></div>
      <div class="field"><label>Title / Role</label><input id="f_title" value="Software Developer" oninput="render()"></div>
      <div class="field"><label>Email</label><input id="f_email" value="kayum15-4043@diu.edu.bd" oninput="render()"></div>
      <div class="field"><label>Phone</label><input id="f_phone" value="+8801734869168" oninput="render()"></div>
      <div class="field"><label>TIN Number</label><input id="f_tin" value="" oninput="render()"></div>
      <div class="field"><label>Address</label><input id="f_addr" value="Barishal, Bangladesh" oninput="render()"></div>
      <div class="field"><label>Portfolio URL</label><input id="f_web" value="mdabdulkayum.github.io/portfolio" oninput="render()"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Invoice Details</div>
      <div class="field-row">
        <div class="field"><label>Invoice #</label><input id="f_invnum" value="INV-2026-001" oninput="render()"></div>
        <div class="field">
          <label>Currency</label>
          <select id="f_currency" onchange="render()">
            <option value="USD">USD $</option>
            <option value="BDT">BDT ৳</option>
            <option value="EUR">EUR €</option>
            <option value="QAR">QAR QR</option>
            <option value="GBP">GBP £</option>
            <option value="AUD">AUD A$</option>
            <option value="CAD">CAD C$</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Issue Date</label><input id="f_date" type="date" oninput="render()"></div>
        <div class="field"><label>Due Date</label><input id="f_due" type="date" oninput="render()"></div>
      </div>
      <div class="field">
        <label>Service Type</label>
        <select id="f_service" onchange="render()">
          <option>Android App Development</option>
          <option>Mobile App Development</option>
          <option>Web Development</option>
          <option>Backend Development</option>
          <option>Full Stack Development</option>
          <option>IT / Software Services</option>
          <option>Academic Consulting</option>
          <option>Consulting</option>
        </select>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Client Info</div>
      <div class="field"><label>Client Name / Company</label><input id="f_cname" placeholder="e.g. Acme Corp" oninput="render()"></div>
      <div class="field"><label>Client Address</label><input id="f_caddr" placeholder="City, Country" oninput="render()"></div>
      <div class="field"><label>Client Email</label><input id="f_cemail" placeholder="client@example.com" oninput="render()"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Line Items</div>
      <div class="items-editor" id="itemsEditor"></div>
      <button class="add-item-btn" onclick="addItem()">+ Add line item</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Discount & Tax</div>
      <div class="field-row">
        <div class="field"><label>Discount %</label><input id="f_disc" type="number" value="0" min="0" max="100" oninput="render()"></div>
        <div class="field"><label>VAT / Tax %</label><input id="f_tax" type="number" value="0" min="0" oninput="render()"></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Bank / Payment</div>
      <div class="field"><label>Bank Name</label><input id="f_bank" placeholder="e.g. Dutch-Bangla Bank" oninput="render()"></div>
      <div class="field"><label>Account Name</label><input id="f_acname" value="Md Abdul Kayum" oninput="render()"></div>
      <div class="field"><label>Account Number</label><input id="f_acnum" placeholder="XXXX XXXX XXXX" oninput="render()"></div>
      <div class="field"><label>SWIFT / BIC Code</label><input id="f_swift" placeholder="e.g. DBBLBDDH" oninput="render()"></div>
      <div class="field"><label>Branch</label><input id="f_branch" placeholder="Branch name, City" oninput="render()"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Notes</div>
      <div class="field">
        <textarea id="f_notes" oninput="render()">Payment via SWIFT wire transfer. Please quote invoice number as reference. This is a service export invoice from Bangladesh — IT/Software Services. All transactions through formal banking channels per Bangladesh Bank guidelines.</textarea>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Accent Color</div>
      <div class="color-row" id="colorRow">
        <div class="color-swatch active" style="background:#c8f135" data-color="#c8f135" onclick="setColor(this)" title="Lime"></div>
        <div class="color-swatch" style="background:#60a5fa" data-color="#60a5fa" onclick="setColor(this)" title="Blue"></div>
        <div class="color-swatch" style="background:#f472b6" data-color="#f472b6" onclick="setColor(this)" title="Pink"></div>
        <div class="color-swatch" style="background:#fb923c" data-color="#fb923c" onclick="setColor(this)" title="Orange"></div>
        <div class="color-swatch" style="background:#34d399" data-color="#34d399" onclick="setColor(this)" title="Teal"></div>
        <div class="color-swatch" style="background:#a78bfa" data-color="#a78bfa" onclick="setColor(this)" title="Purple"></div>
        <div class="color-swatch" style="background:#fbbf24" data-color="#fbbf24" onclick="setColor(this)" title="Amber"></div>
        <div class="color-swatch" style="background:#f87171" data-color="#f87171" onclick="setColor(this)" title="Red"></div>
      </div>
    </div>

  </aside>

  <!-- PREVIEW -->
  <main class="preview-area">
    <div class="summary-pills" id="summaryPills"></div>
    <div class="preview-wrap">
      <div class="inv" id="invoicePreview"></div>
    </div>
  </main>
</div>

<script>
const CURRENCY_SYMBOLS = { USD: '$', BDT: '৳', QAR: 'QR', EUR: '€', GBP: '£', AUD: 'A$', CAD: 'C$' };
let accentColor = '#c8f135';
let items = [
  { desc: 'Android Mobile App Development', note: 'Full native Android app — Kotlin + Jetpack Compose', qty: 40, rate: 25 },
  { desc: 'Backend API Integration', note: 'REST API setup, auth, database schema', qty: 10, rate: 20 },
];

function v(id) { return document.getElementById(id)?.value || ''; }

function fmt(n, sym) {
  return sym + ' ' + parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function setColor(el) {
  accentColor = el.dataset.color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  render();
}

function addItem(desc='', note='', qty=1, rate=0) {
  items.push({ desc, note, qty, rate });
  renderItemsEditor();
  render();
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderItemsEditor();
  render();
}

function updateItem(idx, field, val) {
  items[idx][field] = field === 'qty' || field === 'rate' ? parseFloat(val) || 0 : val;
  renderItemsEditor();
  render();
}

function renderItemsEditor() {
  const ed = document.getElementById('itemsEditor');
  ed.innerHTML = items.map((it, i) => `
    <div class="item-row">
      <div class="item-row-top">
        <input style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;padding:7px 10px;outline:none;width:100%" placeholder="Service description" value="${esc(it.desc)}" oninput="items[${i}].desc=this.value;render()">
        <input type="number" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;outline:none;width:70px" placeholder="Qty" value="${it.qty}" min="0" step="0.5" oninput="items[${i}].qty=parseFloat(this.value)||0;render()">
        <input type="number" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;outline:none;width:80px" placeholder="Rate" value="${it.rate}" min="0" step="0.01" oninput="items[${i}].rate=parseFloat(this.value)||0;render()">
        <button class="item-del" onclick="removeItem(${i})">×</button>
      </div>
      <input style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;padding:6px 10px;outline:none;width:100%" placeholder="Short note (optional)" value="${esc(it.note)}" oninput="items[${i}].note=this.value;render()">
    </div>
  `).join('');
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function calcTotals() {
  const sym = CURRENCY_SYMBOLS[v('f_currency')] || '$';
  let sub = items.reduce((a, it) => a + (it.qty * it.rate), 0);
  const disc = parseFloat(v('f_disc')) || 0;
  const tax = parseFloat(v('f_tax')) || 0;
  const discAmt = sub * disc / 100;
  const afterDisc = sub - discAmt;
  const taxAmt = afterDisc * tax / 100;
  const total = afterDisc + taxAmt;
  return { sub, disc, discAmt, tax, taxAmt, total, sym };
}

function render() {
  const sym = CURRENCY_SYMBOLS[v('f_currency')] || '$';
  const { sub, disc, discAmt, tax, taxAmt, total } = calcTotals();
  const today = new Date().toISOString().split('T')[0];
  const issueDate = v('f_date') || today;
  const dueDate = v('f_due') || '';

  // Summary pills
  document.getElementById('summaryPills').innerHTML = `
    <div class="pill">Items: <span>${items.length}</span></div>
    <div class="pill">Subtotal: <span>${sym}${sub.toFixed(2)}</span></div>
    ${disc > 0 ? `<div class="pill">Discount: <span>-${disc}%</span></div>` : ''}
    ${tax > 0 ? `<div class="pill">Tax: <span>+${tax}%</span></div>` : ''}
    <div class="pill">Total: <span>${sym}${total.toFixed(2)}</span></div>
  `;

  const itemRows = items.map(it => {
    const amt = it.qty * it.rate;
    return `<tr>
      <td><div class="item-desc">${it.desc || '—'}</div>${it.note ? `<div class="item-note">${it.note}</div>` : ''}</td>
      <td style="font-family:'DM Mono',monospace;font-size:13px;color:#555">${it.qty}</td>
      <td style="font-family:'DM Mono',monospace;font-size:13px;color:#555">${sym}${it.rate.toFixed(2)}</td>
      <td>${sym}${amt.toFixed(2)}</td>
    </tr>`;
  }).join('');

  const totalsRows = `
    <div class="inv-total-line"><span class="tl-label">Subtotal</span><span class="tl-val">${sym}${sub.toFixed(2)}</span></div>
    ${disc > 0 ? `<div class="inv-total-line"><span class="tl-label">Discount (${disc}%)</span><span class="tl-val" style="color:#e05">-${sym}${discAmt.toFixed(2)}</span></div>` : ''}
    ${tax > 0 ? `<div class="inv-total-line"><span class="tl-label">Tax/VAT (${tax}%)</span><span class="tl-val">+${sym}${taxAmt.toFixed(2)}</span></div>` : ''}
    <div class="inv-total-line grand"><span class="tl-label">Total Due</span><span class="tl-val">${sym}${total.toFixed(2)}</span></div>
  `;

  const bankRows = [
    ['Bank', v('f_bank')],
    ['Account Name', v('f_acname')],
    ['Account No.', v('f_acnum')],
    ['SWIFT / BIC', v('f_swift')],
    ['Branch', v('f_branch')],
  ].filter(r => r[1]).map(r => `
    <div class="inv-bank-line"><span class="bk">${r[0]}</span><span class="bv">${r[1]}</span></div>
  `).join('');

  document.getElementById('invoicePreview').innerHTML = `
    <style>.inv { --inv-accent: ${accentColor}; }</style>
    <div class="inv-header">
      <div>
        <div class="inv-brand-name">${v('f_name') || 'Your Name'}</div>
        <div class="inv-brand-title">${v('f_title') || ''}</div>
        <div class="inv-brand-contact">
          ${v('f_email') ? v('f_email') + '<br>' : ''}
          ${v('f_phone') ? v('f_phone') + '<br>' : ''}
          ${v('f_tin') ? v('f_tin') + '<br>' : ''}
          ${v('f_addr') ? v('f_addr') : ''}
          ${v('f_web') ? '<br>' + v('f_web') : ''}
        </div>
      </div>
      <div class="inv-meta">
        <div class="inv-label">Invoice</div>
        <div class="inv-num">${v('f_invnum') || 'INV-001'}</div>
        <div class="inv-badge">${v('f_service') || 'IT / Software Services'}</div>
      </div>
    </div>

    <div class="inv-body">
      <div class="inv-info-row">
        <div class="inv-info-block">
          <div class="lbl">Billed To</div>
          <div class="val">${v('f_cname') || '—'}</div>
          <div class="val muted">${v('f_caddr') || ''}</div>
          <div class="val muted">${v('f_cemail') || ''}</div>
        </div>
        <div class="inv-info-block">
          <div class="lbl">Issue Date</div>
          <div class="val">${formatDate(issueDate)}</div>
        </div>
        <div class="inv-info-block">
          <div class="lbl">Due Date</div>
          <div class="val">${dueDate ? formatDate(dueDate) : '—'}</div>
        </div>
      </div>

      <div class="inv-table-wrap">
        <table class="inv-table">
          <thead><tr>
            <th>Description</th>
            <th>Qty / Hrs</th>
            <th>Rate (${v('f_currency') || 'USD'})</th>
            <th>Amount</th>
          </tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
      </div>

      <div class="inv-totals-row">
        <div class="inv-totals">${totalsRows}</div>
      </div>

      <div class="inv-bottom-row">
        <div class="inv-bank-block">
          <div class="blbl">Payment Details</div>
          ${bankRows || '<div style="font-size:12px;color:#ccc;font-family:DM Mono,monospace">Fill in bank details in the sidebar</div>'}
        </div>
        <div class="inv-notes-block">
          <div class="nlbl">Notes & Terms</div>
          <div class="inv-notes-text">${(v('f_notes') || '').replace(/\n/g, '<br>')}</div>
        </div>
      </div>
    </div>

    <div class="inv-footer">
      <div class="inv-footer-left">Service Export Invoice · Bangladesh Bank Compliant · IT/Software Services</div>
      <div class="inv-footer-right">${v('f_invnum') || 'INV-001'} · ${formatDate(issueDate)}</div>
    </div>
  `;
}

function formatDate(d) {
  if (!d) return '—';
  try {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return d; }
}
